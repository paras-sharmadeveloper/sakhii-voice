# Reverse proxy for the Sakhii voice engine behind Webuzo's Apache.
#
# Webuzo includes per-domain directives (no <VirtualHost> wrapper) in both the
# HTTP and HTTPS vhosts of the domain, from:
#   /var/webuzo-data/apache2/custom/domains/voice.YOURDOMAIN.com.conf
# (https://webuzo.com/docs/developers/custom-virtualhost-config/)
#
# Needs mod_proxy, mod_proxy_http and mod_proxy_wstunnel loaded. Check with:
#   /usr/local/apps/apache2/bin/httpd -M | grep -E 'proxy_(http|wstunnel)'
# Exotel must use wss:// (HTTPS vhost); Webuzo's Let's Encrypt cert covers it.

ProxyRequests Off
ProxyPreserveHost On
# Calls are long-lived WebSockets; matches the engine's 600 s graceful drain.
ProxyTimeout 600

# Exotel Voicebot stream. The query string (?token=...&agent_id=...) is
# passed through unchanged.
ProxyPass        /ws/exotel ws://127.0.0.1:8000/ws/exotel
ProxyPassReverse /ws/exotel ws://127.0.0.1:8000/ws/exotel

# Health check (engine + Redis).
ProxyPass        /health http://127.0.0.1:8000/healthz
ProxyPassReverse /health http://127.0.0.1:8000/healthz
