# Reverse proxy for the Sakhii voice engine behind Webuzo's Apache.
#
# Webuzo includes per-domain directives (no <VirtualHost> wrapper) in both the
# HTTP and HTTPS vhosts of the domain, from:
#   /var/webuzo-data/apache2/custom/domains/voice.YOURDOMAIN.com.conf
# (https://webuzo.com/docs/developers/custom-virtualhost-config/)
#
# Needs mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_proxy_balancer,
# mod_lbmethod_byrequests, mod_slotmem_shm and mod_setenvif. Check with:
#   /usr/local/apps/apache2/bin/httpd -M | grep -E 'proxy|lbmethod|slotmem|setenvif'
# Exotel must use wss:// (HTTPS vhost); Webuzo's Let's Encrypt cert covers it.
#
# Two engine instances (sakhii-voice@8000, @8001). A deploy restarts one at a
# time; the stopping one closes its port at once, Apache gets "connection
# refused", marks it in error for `retry` seconds and sends the call to the
# other member. Live calls keep running on the old process until they end.

ProxyRequests Off
ProxyPreserveHost On
# Calls are long-lived WebSockets; matches the engine's 600 s graceful drain.
ProxyTimeout 600

<Proxy "balancer://sakhii_voice_ws">
    BalancerMember "ws://127.0.0.1:8000" connectiontimeout=2 retry=5
    BalancerMember "ws://127.0.0.1:8001" connectiontimeout=2 retry=5
    ProxySet lbmethod=byrequests
</Proxy>

<Proxy "balancer://sakhii_voice_http">
    BalancerMember "http://127.0.0.1:8000" connectiontimeout=2 retry=5
    BalancerMember "http://127.0.0.1:8001" connectiontimeout=2 retry=5
    ProxySet lbmethod=byrequests
</Proxy>

# Exotel Voicebot stream. Exotel's applet drops query parameters, so its URL
# carries the token as a path segment: /ws/exotel/<EXOTEL_WS_TOKEN>.
# More specific prefix first. /ws/exotel?token=... (curl, tools) still works.
ProxyPass        /ws/exotel/ balancer://sakhii_voice_ws/ws/exotel/
ProxyPassReverse /ws/exotel/ balancer://sakhii_voice_ws/ws/exotel/
ProxyPass        /ws/exotel  balancer://sakhii_voice_ws/ws/exotel
ProxyPassReverse /ws/exotel  balancer://sakhii_voice_ws/ws/exotel

# The token is part of the request line, which Apache's access log records.
# This marks those requests; it only takes effect if the vhost's CustomLog
# ends in `env=!dontlog` (see README, "Keeping the token out of logs").
SetEnvIf Request_URI "^/ws/exotel" dontlog

# Health check (engine + Redis), served by whichever instance is up.
ProxyPass        /health balancer://sakhii_voice_http/healthz
ProxyPassReverse /health balancer://sakhii_voice_http/healthz
