# /etc/nginx/sites-available/voice.YOURDOMAIN.com
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Two engine instances; during a deploy one is restarting (port closed) and
# new calls go to the other.
upstream sakhii_voice {
    least_conn;
    server 127.0.0.1:8800 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:8801 max_fails=1 fail_timeout=5s;
}

server {
    listen 443 ssl;
    http2 off;
    server_name voice.YOURDOMAIN.com;

    ssl_certificate     /etc/letsencrypt/live/voice.YOURDOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.YOURDOMAIN.com/privkey.pem;

    location = /ws/exotel {
        proxy_pass http://sakhii_voice;
        proxy_next_upstream error timeout;
        proxy_connect_timeout 2s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Audio frames must not sit in a buffer.
        proxy_buffering off;
        tcp_nodelay on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://sakhii_voice;
        allow 127.0.0.1;
        deny all;
    }

    location / { return 404; }
}

server {
    listen 80;
    server_name voice.YOURDOMAIN.com;
    return 301 https://$host$request_uri;
}
